<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novara · 作业与课程管理</title>
    <meta
      name="description"
      content="面向学生的作业与课程管理工具：作业、课程表、考试记录与组件化面板"
    />
    <script>
      try {
        (function () {
          var t = localStorage.getItem("novara-theme");
          if (t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        })();
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/src/main.tsx"></script>
  </body>
</html>
